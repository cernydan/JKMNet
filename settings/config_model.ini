; config_model.ini  (generated by Shiny app)

[data]
data_file = data/inputs/jm_5y.csv
id = all
id_col = ID
columns = BREZOVA_API, BREZOVA_API, STANOVICE_API, STANOVICE_API, JANSKY_MOST_Q
timestamp = DTM

[model]
model_type = lstm_past_future ; mlp, lstm_first, lstm_past_future
trainer = online_adam_epoch  ; online_bp, batch_bp, online_adam, batch_adam, online_bp_epoch, batch_bp_epoch, online_adam_epoch, batch_adam_epoch, online_bp_momentum, online_bp_penalize, online_bp_momentum_epoch, online_bp_penalize_epoch
architecture = 1		; the last value is number of neurons in output layer (must be equal to 1 for "lstm_past_future" model!!)
input_numbers =  ||||-10:-1	; 0 is present, + is prediction, - is history; length must match number of columns
activation = LEAKYRELU		; RELU, SIGMOID, LINEAR, TANH, LEAKYRELU, GAUSSIAN, ROOTSIG (choose type for each layer in "architecture" or one, same for all)
weight_init = HE   ; RANDOM, LHS, LHS2, XG, HE
# LSTM settings (used when model_type is "lstm_first" or "lstm_past_future")
lstm_past_time_steps = 24
lstm_future_time_steps = 4
lstm_cells = 10

[training]
ensemble_runs = 3
max_iterations = 50
save_epoch_metrics = true
max_metrics_step = 5  ; total number of metrics written into file = ceil(max_iterations % max_metrics_step)
max_error = 0
learning_rate = 0.001
shuffle = true  ; reorder the training patterns before every epoch
seed = 0  ; 0 = random
batch_size = 50  ; used only for batch trainer
train_fraction = 0.8
oversample_quantile = 0.95  ; 0 disables it; use 0.75 for the fourth quartile, for example
oversample_multiplier = 5  ; total copies of each selected pattern; 10 means original + 9 copies
split_shuffle = false  ; false = chronological, true = random train/validation split
transform = MINMAX,NONLINEAR,MINMAX,NONLINEAR,MINMAX	; choose type for each variable in "columns" or one, same for all
transform_alpha = 0.1					; choose value for each variable in "columns" or one, same for all (used for NONLINEAR)
exclude_last_col_from_transform = false
remove_na_before_calib = true

[optimization]
pso_optimize = false
# Objective functions for training
objective_function = DILATE2  ; MSE, DIFF_SLOPE, LEVEL_SLOPE, DIFF_CURVATURE, LEVEL_SLOPE_CURVATURE, NORMALIZED_SLOPE, PERSISTENCE_INDEX, DILATE, DILATE2
objective_alpha = 0.5		; used in LEVEL_SLOPE, LEVEL_SLOPE_CURVATURE, DILATE, DILATE2	; decrease if lag persists
objective_alpha2 = 0.1		; used in LEVEL_SLOPE_CURVATURE, DILATE2

[paths]
out_dir = data/outputs/
log_dir = data/outputs/logs/
calib_mat = data/outputs/calib_mat.csv
weights_csv_init = data/outputs/weights/weights_init.csv
weights_bin_init = data/outputs/weights/weights_init.bin
weights_vec_csv_init = data/outputs/weights/weights_init_vector.csv
weights_vec_bin_init = data/outputs/weights/weights_init_vector.bin
weights_csv = data/outputs/weights/weights_final.csv
weights_bin = data/outputs/weights/weights_final.bin
weights_vec_csv = data/outputs/weights/weights_final_vector.csv
weights_vec_bin = data/outputs/weights/weights_final_vector.bin
real_calib = data/outputs/calib_real.csv
pred_calib = data/outputs/calib_pred.csv
real_valid = data/outputs/valid_real.csv
pred_valid = data/outputs/valid_pred.csv
metrics_cal = data/outputs/metrics/calib_metrics.csv
metrics_val = data/outputs/metrics/valid_metrics.csv
run_info = data/outputs/metrics/run_info.csv
errors_csv = data/outputs/metrics/errors.csv
pattern_indices = data/outputs/pattern_indices.csv
